[package]
name = "ilearn-gui"
version = "0.1.0"
description = "学在吉大桌面客户端"
authors = ["ilearn"]
license = "BSD-3-Clause"
edition = "2021"

[lib]
name = "ilearn_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
axum = "0.8"
url = "2"
tokio = { version = "1", features = ["sync", "net", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream"] }
ilearn-core = { package = "ilearn-cli", path = "../../ilearn-cli" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true


