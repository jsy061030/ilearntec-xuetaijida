name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

run-name: Release v0.1.${{ github.run_number }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            msvc_arch: amd64
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            bundles: nsis
            msvc_arch: arm64
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: dmg
            msvc_arch: ""
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage
            msvc_arch: ""
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            bundles: appimage
            msvc_arch: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ilearn-gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target(s)
        shell: bash
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ilearn-gui/src-tauri -> target
          key: ${{ matrix.name }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            libfuse2

      - name: Install frontend dependencies
        working-directory: ilearn-gui
        shell: bash
        run: npm ci

      - name: Build Tauri app
        working-directory: ilearn-gui
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          TARGET="${{ matrix.target }}"
          case "${{ matrix.name }}" in
            windows-*)
              cp "ilearn-gui/src-tauri/target/$TARGET/release/bundle/nsis/"*.exe \
                 "artifacts/ilearn-gui-${{ matrix.name }}.exe"
              ;;
            macos-*)
              cp "ilearn-gui/src-tauri/target/$TARGET/release/bundle/dmg/"*.dmg \
                 "artifacts/ilearn-gui-${{ matrix.name }}.dmg"
              APP=$(find "ilearn-gui/src-tauri/target/$TARGET/release/bundle/macos" \
                -maxdepth 1 -name "*.app" -print -quit)
              test -n "$APP"
              ditto -c -k --sequesterRsrc --keepParent "$APP" \
                "artifacts/ilearn-gui-${{ matrix.name }}.app.zip"
              ;;
            linux-*)
              cp "ilearn-gui/src-tauri/target/$TARGET/release/bundle/appimage/"*.AppImage \
                 "artifacts/ilearn-gui-${{ matrix.name }}.AppImage"
              ;;
          esac
          ls -lh artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: 学在吉大 v0.1.${{ github.run_number }}
          body: |
            学在吉大桌面客户端自动构建。

            - Commit: `${{ github.sha }}`
            - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            包含：
            - Windows x86_64 / ARM64 安装包（NSIS）
            - macOS Universal 应用（DMG + APP ZIP）
            - Linux x86_64 / ARM64 AppImage
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
